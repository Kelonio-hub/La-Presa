name: Actualizar siguientes 50 guías y referencias del sitio

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Actualizar siguientes 50 guías y archivos principales
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "guias/3DS - Pretendo.html"
            "guias/3DS - Ronin.html"
            "guias/3DS - SDLoader.html"
            "guias/3DS - Semibrick.html"
            "guias/3DS - Slottool.html"
            "guias/3DS - Speculum.html"
            "guias/3DS - Splash.html"
            "guias/3DS - Sysupdater.html"
            "guias/3DS - Themely.html"
            "guias/3DS - Tiksweep.html"
            "guias/3DS - Tiny.html"
            "guias/3DS - Title Rex.html"
            "guias/3DS - Tokyo Trim.html"
            "guias/3DS - Tunavids.html"
            "guias/3DS - Twlfix.html"
            "guias/3DS - Twlmenu.html"
            "guias/3DS - Universal.html"
            "guias/3DS - Youtube.html"
            "guias/3DS - y Luma.html"
            "guias/3DS - yy Luma  - ARM9.html"
            "guias/3DS - yy Luma - Ctrnandload.html"
            "guias/3DS - yy Luma - arm11-core0.html"
            "guias/3DS - yy Luma - arm11-core1.html"
            "guias/3DS - yy Luma - arm11-core2.html"
            "guias/3DS - yy Luma - arm11-core3.html"
            "guias/3DS - yy Luma - emunand-detected.html"
            "guias/3DS - yy Luma - errdisp-15.html"
            "guias/3DS - yy Luma - errdisp-19.html"
            "guias/3DS - yy Luma - errdisp-21.html"
            "guias/3DS - yy Luma - errdisp-25.html"
            "guias/3DS - yy Luma - errdisp-26.html"
            "guias/3DS - yy Luma - errdisp-30.html"
            "guias/3DS - yy Luma - errdisp-36.html"
            "guias/3DS - yy Luma - errdisp-37.html"
            "guias/3DS - yy Luma - errdisp-38.html"
            "guias/3DS - yy Luma - errdisp-sd.html"
            "guias/3DS - yy Luma - firm-patches.html"
            "guias/3DS - yy Luma - launcher-argc.html"
            "guias/3DS - z FBI.html"
            "guias/3DS - zz Error http40-http254.html"
            "guias/3DS - zz Error-am32.html"
            "guias/3DS - zz Error-applet51.html"
            "guias/3DS - zz Error-cam11-cam20.html"
            "guias/3DS - zz Error-fs17.html"
            "guias/NDS - 1 Hack Memory.html"
            "guias/NDS - 2 Hack Stylehax.html"
            "guias/NDS - 3 NAND.html"
            "guias/NDS - 4 Eliminar Hack.html"
            "guias/NDS - Online.html"
            "guias/NDS - Twlmenu.html"
          )
          for f in guias.html index.html sitemap.xml robots.txt "${files[@]}"; do
            [ -f "$f" ] || { echo "Falta $f"; exit 1; }
            perl -0pi -e 's#https://kelonio-hub\.github\.io/Archivos-Kelonio#https://kelonio.eu.org#g; s#https://raw\.githubusercontent\.com/Kelonio-hub/Archivos-Kelonio/#https://raw.githubusercontent.com/Kelonio-hub/La-Presa/#g; s#Kelonio-hub/Archivos-Kelonio#Kelonio-hub/La-Presa#g' "$f"
          done

      - name: Commit y push
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No hay cambios que guardar."
            exit 0
          fi
          git add -- guias.html index.html sitemap.xml robots.txt guias/
          git commit -m "Actualizar siguientes 50 guías y referencias al nuevo dominio"
          git push origin HEAD:main
