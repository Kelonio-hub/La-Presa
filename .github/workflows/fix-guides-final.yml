            "guias/vWII UsbLoader.html"
          )
          echo "Total de guías pendientes: ${#files[@]}"
          for f in "${files[@]}"; do
            [ -f "$f" ] || { echo "Falta $f"; exit 1; }
            perl -0pi -e 's#https://kelonio-hub\.github\.io/Archivos-Kelonio#https://kelonio.eu.org#g; s#https://raw\.githubusercontent\.com/Kelonio-hub/Archivos-Kelonio/#https://raw.githubusercontent.com/Kelonio-hub/La-Presa/#g; s#Kelonio-hub/Archivos-Kelonio#Kelonio-hub/La-Presa#g' "$f"
          done

      - name: Commit y push
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Las guías pendientes ya estaban actualizadas."
            exit 0
          fi
          git add -- guias/
          git commit -m "Actualizar últimas guías al dominio kelonio.eu.org"
          git push origin HEAD:main
